tags:
- name: Create
  description: 作成系：S3 バケット/オブジェクト、SQS キュー/メッセージ、SNS トピック/購読/発行、メール送信、DynamoDB テーブル
- name: Read
  description: 参照系：一覧・取得・検索（DynamoDB Query）、SMTP 設定取得・接続テスト、ヘルスチェック
- name: Update
  description: 更新系：SMTP 設定の保存、DynamoDB アイテムの追加・上書き
- name: Delete
  description: 削除系：S3 / SQS / SNS / DynamoDB のリソース、購読解除、Mailbox の記録
