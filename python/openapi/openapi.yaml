      description: 'AWS の CreateTable と同じです。パーティションキー（必須）・ソートキー（任意）・GSI・LSI・課金モードを指定します。


        - キーの型は S / N / B。キー以外の属性は定義不要（アイテムはスキーマレス）

        - LSI はテーブルにソートキーが必要で、作成時にしか追加できません

        - テーブル名やキー・インデックスの制約違反は、DynamoDB の `ValidationException` がそのまま返ります'
      operationId: create_table_endpoint_api_dynamodb_tables_post
