        `confirmed`（承認済み）、その他のプロトコルは常に `confirmed`。'
      operationId: list_subscriptions_api_sns_topics__topic_arn__subscriptions_get
      parameters:
      - name: topic_arn
        in: path
        required: true
        schema:
          type: string
          title: Topic Arn
          description: トピック ARN
        description: トピック ARN
