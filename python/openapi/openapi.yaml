      tags:
      - Read
      summary: '[SMTP] 接続テスト'
      description: 'SMTP が未設定・無効なら擬似送信モードとして設定不要で成功（`mode: local`）を返します。有効なら保存済みの設定で接続（＋認証）だけを行います（`mode:
