components:
  schemas:
    ColumnDef:
      properties:
        name:
          description: カラム名
          examples:
          - user_id
          title: Name
          type: string
        type:
          default: S
          description: 型（主キー・インデックスに使うカラムは S / N / B）
          enum:
          - S
          - N
          - B
          - BOOL
          - L
          - M
          title: Type
          type: string
        required:
          default: false
          description: 必須か（主キーは自動で必須）
          title: Required
          type: boolean
        description:
          default: ''
          description: 説明
          title: Description
          type: string
      required:
      - name
      title: ColumnDef
      type: object
    CreateBucketRequest:
      properties:
        bucket_name:
          description: 作成するバケット名
          examples:
          - my-local-bucket
          title: Bucket Name
          type: string
      required:
      - bucket_name
      title: CreateBucketRequest
      type: object
    CreateDatabaseRequest:
      properties:
        name:
          description: DB 名（英数字・_・-。実テーブル名の接頭辞になる）
          examples:
          - shop
          title: Name
          type: string
        description:
          default: ''
          description: 説明
          examples:
          - EC サイトのデータ
          title: Description
          type: string
      required:
      - name
      title: CreateDatabaseRequest
      type: object
    CreateQueueRequest:
      properties:
        queue_name:
          description: 作成するキュー名
          examples:
          - my-queue
          title: Queue Name
          type: string
      required:
      - queue_name
      title: CreateQueueRequest
      type: object
    CreateSchemaTableRequest:
      examples:
      - columns:
        - name: order_id
          type: S
        - name: user_id
          required: true
          type: S
        - name: created_at
          type: S
        - name: total
          type: N
        description: 注文
        foreign_keys:
        - columns:
          - user_id
          ref_table: users
        indexes:
        - name: user_id-index
          partition_key: user_id
          sort_key: created_at
          type: GSI
        name: orders
        partition_key: order_id
      properties:
        name:
          description: テーブル名（DB 内での名前。実テーブル名は `DB名.テーブル名`）
          examples:
          - orders
          title: Name
          type: string
        description:
          default: ''
          description: 説明
          title: Description
          type: string
        columns:
          description: カラム定義
          items:
            $ref: '#/components/schemas/ColumnDef'
          title: Columns
          type: array
        partition_key:
          description: パーティションキーにするカラム名
          examples:
          - order_id
          title: Partition Key
          type: string
        sort_key:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ソートキーにするカラム名（任意）
          title: Sort Key
        indexes:
          description: セカンダリインデックス
          items:
            $ref: '#/components/schemas/IndexDef'
          title: Indexes
          type: array
        foreign_keys:
          description: 他テーブル（または自分自身）の主キーへの参照
          items:
            $ref: '#/components/schemas/ForeignKeyDef'
          title: Foreign Keys
          type: array
        billing_mode:
          default: PAY_PER_REQUEST
          description: 課金モード
          enum:
          - PAY_PER_REQUEST
          - PROVISIONED
          title: Billing Mode
          type: string
        read_capacity_units:
          default: 5
          description: PROVISIONED 時の RCU
          minimum: 1
          title: Read Capacity Units
          type: integer
        write_capacity_units:
          default: 5
          description: PROVISIONED 時の WCU
          minimum: 1
          title: Write Capacity Units
          type: integer
      required:
      - name
      - columns
      - partition_key
      title: CreateSchemaTableRequest
      type: object
    CreateTopicRequest:
      properties:
        topic_name:
          description: 作成するトピック名
          examples:
          - my-topic
          title: Topic Name
          type: string
      required:
      - topic_name
      title: CreateTopicRequest
      type: object
    DeleteItemFlatRequest:
      properties:
        table_name:
          description: テーブル名
          examples:
          - users
          title: Table Name
          type: string
        key_attributes:
          additionalProperties:
            additionalProperties: true
            type: object
          description: 削除するアイテムのキー（DynamoDB 形式）
          examples:
          - id:
              S: user-1
          title: Key Attributes
          type: object
      required:
      - table_name
      - key_attributes
      title: DeleteItemFlatRequest
      type: object
    DeleteItemRequest:
      properties:
        key:
          additionalProperties:
            additionalProperties: true
            type: object
          description: 削除するアイテムのキー（DynamoDB 形式）
          examples:
          - id:
              S: user-1
          title: Key
          type: object
      required:
      - key
      title: DeleteItemRequest
      type: object
    ErrorResponse:
      properties:
        detail:
          description: エラー内容
          examples:
          - An error occurred (NoSuchBucket) ...
          title: Detail
          type: string
      required:
      - detail
      title: ErrorResponse
      type: object
    ForeignKeyDef:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 外部キー名（省略時は自動）
          title: Name
        columns:
          description: このテーブルのカラム。参照先の主キーと同じ数（PK のみなら 1 つ、PK+SK なら 2 つ）
          examples:
          - - user_id
          items:
            type: string
          title: Columns
          type: array
        ref_table:
          description: 参照先テーブル名（同じ DB 内。DB 名は付けない）
          examples:
          - users
          title: Ref Table
          type: string
      required:
      - columns
      - ref_table
      title: ForeignKeyDef
      type: object
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    IndexDef:
      properties:
        name:
          description: インデックス名（3 文字以上）
          examples:
          - user_id-index
          title: Name
          type: string
        type:
          default: GSI
          description: GSI（任意のキー）/ LSI（テーブルと同じ PK ＋ 別の SK。テーブルに SK が必要）
          enum:
          - GSI
          - LSI
          title: Type
          type: string
        partition_key:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: GSI のパーティションキー（LSI では無視）
          examples:
          - user_id
          title: Partition Key
        sort_key:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ソートキー（GSI は任意、LSI は必須）
          examples:
          - created_at
          title: Sort Key
        projection_type:
          default: ALL
          description: 射影
          enum:
          - ALL
          - KEYS_ONLY
          title: Projection Type
          type: string
      required:
      - name
      title: IndexDef
      type: object
    ItemAttribute:
      properties:
        name:
          description: 属性名
          examples:
          - id
          title: Name
          type: string
        type:
          default: S
          description: 型（S / N / BOOL / M / L など）
          title: Type
          type: string
        value:
          description: 値
          examples:
          - user-1
          title: Value
      required:
      - name
      - value
      title: ItemAttribute
      type: object
    PipelineBroadcastRequest:
      properties:
        topic_arn:
          description: 配信元トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        subject:
          default: 重要なお知らせ
          description: 件名
          title: Subject
          type: string
        message:
          description: メッセージ本文
