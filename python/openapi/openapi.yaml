        required: true
        schema:
          type: string
          title: Bucket Name
          description: バケット名
        description: バケット名
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
          description: オブジェクトキー（スラッシュを含んでもよい）
        description: オブジェクトキー（スラッシュを含んでもよい）
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
