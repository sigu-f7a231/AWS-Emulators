components:
  schemas:
    ConfirmSubscriptionRequest:
      properties:
        token:
          description: 確認メールのリンクに含まれるトークン
          title: Token
          type: string
        topic_arn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: トピック ARN（指定すればトークンのトピックと一致するか確認する）
          title: Topic Arn
      required:
      - token
      title: ConfirmSubscriptionRequest
      type: object
    CreateBucketRequest:
      properties:
        bucket_name:
          description: 作成するバケット名
          examples:
          - my-local-bucket
          title: Bucket Name
          type: string
      required:
      - bucket_name
      title: CreateBucketRequest
      type: object
    CreateQueueRequest:
      properties:
        queue_name:
          description: 作成するキュー名
          examples:
          - my-queue
          title: Queue Name
          type: string
      required:
      - queue_name
      title: CreateQueueRequest
      type: object
    CreateTopicRequest:
      properties:
        topic_name:
          description: 作成するトピック名
          examples:
          - my-topic
          title: Topic Name
          type: string
      required:
      - topic_name
      title: CreateTopicRequest
      type: object
    DeleteItemFlatRequest:
      properties:
        table_name:
          description: テーブル名
          examples:
          - Users
          title: Table Name
          type: string
        key_attributes:
          additionalProperties:
            additionalProperties: true
            type: object
          description: 削除するアイテムのキー（DynamoDB JSON）
          examples:
          - id:
              S: user-1
          title: Key Attributes
          type: object
      required:
      - table_name
      - key_attributes
      title: DeleteItemFlatRequest
      type: object
    DeleteItemRequest:
      properties:
        key:
          additionalProperties:
            additionalProperties: true
            type: object
          description: 削除するアイテムのキー（DynamoDB JSON）
          examples:
          - id:
              S: user-1
          title: Key
          type: object
      required:
      - key
      title: DeleteItemRequest
      type: object
    ErrorResponse:
      properties:
        detail:
          description: エラー内容
          examples:
          - An error occurred (NoSuchBucket) ...
          title: Detail
          type: string
      required:
      - detail
      title: ErrorResponse
      type: object
    FullCreateTableRequest:
      properties:
        table_name:
          description: テーブル名（3〜255 文字、英数字・_・-・.）
          examples:
          - Users
          title: Table Name
          type: string
        partition_key_name:
          description: パーティションキー名
          examples:
          - id
          title: Partition Key Name
          type: string
        partition_key_type:
          default: S
          description: 型（S / N / B）
          enum:
          - S
          - N
          - B
          title: Partition Key Type
          type: string
        sort_key_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ソートキー名（任意）
          title: Sort Key Name
        sort_key_type:
          anyOf:
          - enum:
            - S
            - N
            - B
            type: string
          - type: 'null'
          default: S
          description: 型（S / N / B）
          title: Sort Key Type
        billing_mode:
          default: PAY_PER_REQUEST
          description: 課金モード
          enum:
          - PAY_PER_REQUEST
          - PROVISIONED
          title: Billing Mode
          type: string
        read_capacity_units:
          default: 5
          description: PROVISIONED 時の RCU
          minimum: 1
          title: Read Capacity Units
          type: integer
        write_capacity_units:
          default: 5
          description: PROVISIONED 時の WCU
          minimum: 1
          title: Write Capacity Units
          type: integer
        gsis:
          anyOf:
          - items:
              $ref: '#/components/schemas/GsiDefinition'
            type: array
          - type: 'null'
          default: null
          description: グローバルセカンダリインデックス
          title: Gsis
        lsis:
          anyOf:
          - items:
              $ref: '#/components/schemas/LsiDefinition'
            type: array
          - type: 'null'
          default: null
          description: ローカルセカンダリインデックス（テーブルにソートキーが必要・作成時のみ指定可）
          title: Lsis
      required:
      - table_name
      - partition_key_name
      title: FullCreateTableRequest
      type: object
    GsiDefinition:
      properties:
        name:
          description: インデックス名
          examples:
          - email-index
          title: Name
          type: string
        partition_key:
          description: パーティションキー名
          examples:
          - email
          title: Partition Key
          type: string
        partition_key_type:
          default: S
          description: 型（S / N / B）
          enum:
          - S
          - N
          - B
          title: Partition Key Type
          type: string
        sort_key:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ソートキー名（任意）
          title: Sort Key
        sort_key_type:
          anyOf:
          - enum:
            - S
            - N
            - B
            type: string
          - type: 'null'
          default: S
          description: 型（S / N / B）
          title: Sort Key Type
        projection_type:
          default: ALL
          description: 射影（INCLUDE のときは non_key_attributes も指定）
          enum:
          - ALL
          - KEYS_ONLY
          - INCLUDE
          title: Projection Type
          type: string
        non_key_attributes:
          description: INCLUDE で射影する非キー属性
          items:
            type: string
          title: Non Key Attributes
          type: array
      required:
      - name
      - partition_key
      title: GsiDefinition
      type: object
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ItemAttribute:
      properties:
        name:
          description: 属性名
          examples:
          - id
          title: Name
          type: string
        type:
          default: S
          description: 型（S / N / B / BOOL / NULL / M / L / SS / NS / BS）
          enum:
          - S
          - N
          - B
          - BOOL
          - 'NULL'
          - M
          - L
          - SS
          - NS
          - BS
          title: Type
          type: string
        value:
          default: ''
          description: 値。B は base64、M / L は JSON、SS / NS / BS は JSON 配列かカンマ区切り
          examples:
          - user-1
          title: Value
      required:
      - name
      title: ItemAttribute
      type: object
    LsiDefinition:
      properties:
        name:
          description: インデックス名
          examples:
          - created-index
          title: Name
          type: string
        sort_key:
          description: ソートキー名（パーティションキーはテーブルと同じ）
          examples:
          - created_at
          title: Sort Key
          type: string
        sort_key_type:
          default: S
          description: 型（S / N / B）
          enum:
          - S
          - N
          - B
          title: Sort Key Type
          type: string
        projection_type:
          default: ALL
          description: 射影
          enum:
          - ALL
          - KEYS_ONLY
          - INCLUDE
          title: Projection Type
          type: string
        non_key_attributes:
          description: INCLUDE で射影する非キー属性
          items:
            type: string
          title: Non Key Attributes
          type: array
      required:
      - name
      - sort_key
      title: LsiDefinition
      type: object
    PipelineBroadcastRequest:
      properties:
        topic_arn:
          description: 配信元トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        subject:
          default: 重要なお知らせ
          description: 件名
          title: Subject
          type: string
        message:
          description: メッセージ本文
          examples:
          - SNSパイプライン経由のブロードキャストメッセージです。
          title: Message
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: 送信方法。local = 擬似送信 / smtp = SMTP で送信（未設定なら 400、SNS への発行もしない）/
            省略 = SMTP が有効なら SMTP
          title: Delivery Mode
      required:
      - topic_arn
      - message
      title: PipelineBroadcastRequest
      type: object
    PublishFlatRequest:
      properties:
        topic_arn:
          description: トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        subject:
          default: 通知
          description: 件名
          title: Subject
          type: string
        message:
          description: メッセージ本文
          examples:
          - システムメンテナンスのお知らせ
          title: Message
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: 送信方法。local = 擬似送信 / smtp = SMTP で送信（未設定なら 400、SNS への発行もしない）/
            省略 = SMTP が有効なら SMTP
          title: Delivery Mode
      required:
      - topic_arn
      - message
      title: PublishFlatRequest
      type: object
    PublishTopicRequest:
      properties:
        subject:
          default: Notification from AWS SNS
          description: 件名
          title: Subject
          type: string
        message:
          description: メッセージ本文
          examples:
          - システムメンテナンスのお知らせ
          title: Message
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: 送信方法。local = 擬似送信 / smtp = SMTP で送信（未設定なら 400、SNS への発行もしない）/
            省略 = SMTP が有効なら SMTP
          title: Delivery Mode
      required:
      - message
      title: PublishTopicRequest
      type: object
    PutItemFlatRequest:
      properties:
        item:
          anyOf:
          - additionalProperties:
              additionalProperties: true
              type: object
            type: object
          - type: 'null'
          default: null
          description: アイテム（DynamoDB JSON）。attributes と どちらか一方を指定
          examples:
          - active:
              BOOL: true
            age:
              N: '30'
            id:
              S: user-1
            profile:
              M:
                city:
                  S: Tokyo
            tags:
              SS:
              - a
              - b
          title: Item
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/ItemAttribute'
            type: array
          - type: 'null'
          default: null
          description: アイテム（画面の行形式）。item と どちらか一方を指定
          title: Attributes
        table_name:
          description: テーブル名
          examples:
          - Users
          title: Table Name
          type: string
      required:
      - table_name
      title: PutItemFlatRequest
      type: object
    PutItemRequest:
      properties:
        item:
          anyOf:
          - additionalProperties:
              additionalProperties: true
              type: object
            type: object
          - type: 'null'
          default: null
          description: アイテム（DynamoDB JSON）。attributes と どちらか一方を指定
          examples:
          - active:
              BOOL: true
            age:
              N: '30'
            id:
              S: user-1
            profile:
              M:
                city:
                  S: Tokyo
            tags:
              SS:
              - a
              - b
          title: Item
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/ItemAttribute'
            type: array
          - type: 'null'
          default: null
          description: アイテム（画面の行形式）。item と どちらか一方を指定
          title: Attributes
      title: PutItemRequest
      type: object
    PutObjectFlatRequest:
      properties:
        bucket_name:
          description: アップロード先バケット名
          examples:
          - my-local-bucket
          title: Bucket Name
          type: string
        object_key:
          description: オブジェクトキー
          examples:
          - docs/hello.txt
          title: Object Key
          type: string
        content:
          default: ''
          description: オブジェクトの内容（UTF-8 テキスト）
          examples:
          - Hello, S3!
          title: Content
          type: string
      required:
      - bucket_name
      - object_key
      title: PutObjectFlatRequest
      type: object
    PutObjectRequest:
      properties:
        key:
          description: オブジェクトキー
          examples:
          - docs/hello.txt
          title: Key
          type: string
        content:
          description: オブジェクトの内容（UTF-8 テキスト）
          examples:
          - Hello, S3!
          title: Content
          type: string
      required:
      - key
      - content
      title: PutObjectRequest
      type: object
    QueryItemsRequest:
      properties:
        key_conditions:
          additionalProperties: true
          description: 'キー条件（属性名 → 値）。値の型はキー定義から決まる。DynamoDB JSON（{"N": "1"}）でも可'
          examples:
          - id: user-1
          title: Key Conditions
          type: object
        index_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 使用するインデックス名（省略時はテーブル本体）
          title: Index Name
      required:
      - key_conditions
      title: QueryItemsRequest
      type: object
    ResendConfirmationRequest:
      properties:
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: 確認メールの送信方法。local = 擬似送信 / smtp = SMTP（未設定なら 400）/ 省略 = SMTP
            が有効なら SMTP
          title: Delivery Mode
      title: ResendConfirmationRequest
      type: object
    SendEmailTaskRequest:
      properties:
        to_email:
          description: 送信先メールアドレス
          examples:
          - user@example.com
          title: To Email
          type: string
        subject:
          description: 件名
          examples:
          - テストメール
          title: Subject
          type: string
        body:
          description: 本文
          examples:
          - ローカル環境からのテストメールです。
          title: Body
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: 送信方法。local = 擬似送信 / smtp = SMTP で送信（未設定なら 400）/ 省略 = SMTP が有効なら
            SMTP
          title: Delivery Mode
      required:
      - to_email
      - subject
      - body
      title: SendEmailTaskRequest
      type: object
    SendMailRequest:
      properties:
        to:
          description: 送信先メールアドレス
          examples:
          - user@example.com
          title: To
          type: string
        subject:
          default: ''
          description: 件名
          examples:
          - テストメール
          title: Subject
          type: string
        body:
          default: ''
          description: 本文
          examples:
          - ローカル環境からのテストメールです。
          title: Body
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: 送信方法。local = 擬似送信 / smtp = SMTP で送信（未設定なら 400）/ 省略 = SMTP が有効なら
            SMTP
          title: Delivery Mode
      required:
      - to
      title: SendMailRequest
      type: object
    SendMessageFlatRequest:
      properties:
        queue_url:
          description: 送信先キュー URL
          examples:
          - https://aws-emulator:9297/000000000000/my-queue
          title: Queue Url
          type: string
        message_body:
          description: メッセージ本文
          examples:
          - '{"hello": "world"}'
          title: Message Body
          type: string
      required:
      - queue_url
      - message_body
      title: SendMessageFlatRequest
      type: object
    SendMessageRequest:
      properties:
        message_body:
          description: メッセージ本文
          examples:
          - '{"hello": "world"}'
          title: Message Body
          type: string
      required:
      - message_body
      title: SendMessageRequest
      type: object
    SmtpConfigRequest:
      properties:
        smtp_host:
          description: SMTP ホスト（空なら実送信しない）
          examples:
          - smtp.gmail.com
          title: Smtp Host
          type: string
        smtp_port:
          default: 587
          description: ポート（465=SSL / それ以外は STARTTLS を試行）
          examples:
          - 587
          title: Smtp Port
          type: integer
        smtp_user:
          default: ''
          description: 認証ユーザー名（不要なら空）
          title: Smtp User
          type: string
        smtp_password:
          default: ''
          description: パスワード。空なら保存済みの値を維持する
          title: Smtp Password
          type: string
        smtp_from:
          default: aws-emulator@local.test
          description: 送信元アドレス（From）
          title: Smtp From
          type: string
        is_enabled:
          default: true
          description: 実メール送信を有効にするか
          title: Is Enabled
          type: boolean
        clear_password:
          default: false
          description: true なら保存済みパスワードを削除する
          title: Clear Password
          type: boolean
      required:
      - smtp_host
      title: SmtpConfigRequest
      type: object
    SmtpConfigResponse:
      properties:
        smtp_host:
          title: Smtp Host
          type: string
        smtp_port:
          title: Smtp Port
          type: integer
        smtp_user:
          title: Smtp User
          type: string
        smtp_password:
          default: ''
          description: 常に空文字（パスワードは返さない）
          title: Smtp Password
          type: string
        smtp_from:
          title: Smtp From
          type: string
        is_enabled:
          title: Is Enabled
          type: boolean
        has_password:
          description: パスワードが保存済みかどうか
          title: Has Password
          type: boolean
      required:
      - smtp_host
      - smtp_port
      - smtp_user
      - smtp_from
      - is_enabled
      - has_password
      title: SmtpConfigResponse
      type: object
    SmtpSaveResponse:
      properties:
        message:
          title: Message
          type: string
        config:
          $ref: '#/components/schemas/SmtpConfigResponse'
      required:
      - message
      - config
      title: SmtpSaveResponse
      type: object
    SmtpTestResponse:
      properties:
        ok:
          description: 接続（＋認証）に成功したか。擬似送信モードでは常に true
          title: Ok
          type: boolean
        mode:
          description: local = 擬似送信モード（SMTP 未設定・外部に送らない）/ smtp = 実 SMTP
          examples:
          - local
          title: Mode
          type: string
        detail:
          description: 結果の詳細またはエラー内容
          title: Detail
          type: string
      required:
      - ok
      - mode
      - detail
      title: SmtpTestResponse
      type: object
    SubscribeEmailRequest:
      properties:
        topic_arn:
          description: トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        email:
          description: 登録するメールアドレス
          examples:
          - user@example.com
          title: Email
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: email 購読の確認メールの送信方法。local = 擬似送信 / smtp = SMTP / 省略 = SMTP
            が有効なら SMTP
          title: Delivery Mode
      required:
      - topic_arn
      - email
      title: SubscribeEmailRequest
      type: object
    SubscribeFlatRequest:
      properties:
        topic_arn:
          description: トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        protocol:
          default: email
          description: プロトコル（email / sqs など）
          title: Protocol
          type: string
        endpoint:
          description: メールアドレスまたは SQS キュー ARN
          examples:
          - user@example.com
          title: Endpoint
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: email 購読の確認メールの送信方法。local = 擬似送信 / smtp = SMTP / 省略 = SMTP
            が有効なら SMTP
          title: Delivery Mode
      required:
      - topic_arn
      - endpoint
      title: SubscribeFlatRequest
      type: object
    SubscribeSqsFlatRequest:
      properties:
        topic_arn:
          description: トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        queue_url:
          description: 紐付ける SQS キュー URL
          examples:
          - https://aws-emulator:9297/000000000000/my-queue
          title: Queue Url
          type: string
      required:
      - topic_arn
      - queue_url
      title: SubscribeSqsFlatRequest
      type: object
    SubscribeSqsRequest:
      properties:
        topic_arn:
          description: トピック ARN
          examples:
          - arn:aws:sns:us-east-1:000000000000:my-topic
          title: Topic Arn
          type: string
        queue_name:
          description: 紐付ける SQS キュー名
          examples:
          - my-queue
          title: Queue Name
          type: string
      required:
      - topic_arn
      - queue_name
      title: SubscribeSqsRequest
      type: object
    SubscribeTopicRequest:
      properties:
        protocol:
          default: email
          description: プロトコル（email / sqs など）
          examples:
          - email
          title: Protocol
          type: string
        endpoint:
          description: メールアドレスまたは SQS キュー ARN
          examples:
          - user@example.com
          title: Endpoint
          type: string
        delivery_mode:
          anyOf:
          - enum:
            - local
            - smtp
            type: string
          - type: 'null'
          default: null
          description: email 購読の確認メールの送信方法。local = 擬似送信 / smtp = SMTP / 省略 = SMTP
            が有効なら SMTP
          title: Delivery Mode
      required:
      - endpoint
      title: SubscribeTopicRequest
      type: object
    UnsubscribeWithTokenRequest:
      properties:
        subscription_arn:
          description: サブスクリプション ARN
          title: Subscription Arn
          type: string
        token:
          description: 通知メールの配信停止リンクに含まれるトークン
          title: Token
          type: string
      required:
      - subscription_arn
      - token
      title: UnsubscribeWithTokenRequest
      type: object
    ValidationError:
      title: ValidationError
      type: object
      required:
      - loc
      - msg
      - type
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
tags:
- name: Create
  description: 作成系：S3 バケット/オブジェクト、SQS キュー/メッセージ、SNS トピック/購読/発行、メール送信、DynamoDB テーブル
- name: Read
  description: 参照系：一覧・取得・検索（DynamoDB Query）、SMTP 設定取得・接続テスト、ヘルスチェック
- name: Update
  description: 更新系：SMTP 設定の保存、DynamoDB アイテムの追加・上書き
- name: Delete
  description: 削除系：S3 / SQS / SNS / DynamoDB のリソース、購読解除、Mailbox の記録
